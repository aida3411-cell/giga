<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기술가정 수업하기</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg1: #eaf5ff;
      --bg2: #edfdf5;
      --card: #ffffff;
      --text: #17324d;
      --sub: #52677a;
      --primary: #2479d8;
      --primary-dark: #1764b9;
      --soft: #eef5ff;
      --soft-border: #d9e6f5;
      --accent: #ffbd42;
      --shadow: 0 14px 40px rgba(25, 65, 105, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      overflow-x: hidden;
    }
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .panel {
      width: 100%;
      max-width: 1180px;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow);
    }
    .screen { display: none; }
    .screen.active { display: block; }

    /* 첫 화면 */
    .hero {
      position: relative;
      min-height: 690px;
      overflow: hidden;
      border-radius: 26px;
      background: linear-gradient(180deg, #eaf5ff 0%, #f8fcff 55%, #effcf4 100%);
      border: 1px solid #dcebf8;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-inner {
      position: relative;
      z-index: 5;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 38px 24px 28px;
      border-radius: 28px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 16px 38px rgba(71, 116, 164, 0.12);
      backdrop-filter: blur(3px);
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #ffffff;
      color: #356089;
      border: 1px solid #d8e8f8;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(53, 96, 137, 0.08);
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.22;
      word-break: keep-all;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 24px;
      font-size: clamp(15px, 3.8vw, 18px);
      line-height: 1.7;
      color: var(--sub);
      word-break: keep-all;
      text-align: center;
    }

    .cloud {
      position: absolute;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(220,235,248,0.95);
      box-shadow: 0 10px 26px rgba(100, 141, 185, 0.12);
      border-radius: 999px;
      animation: cloudFloat linear infinite;
      will-change: transform;
    }
    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border: inherit;
      border-radius: 999px;
    }
    .cloud::before { width: 42%; height: 70%; left: 11%; top: -32%; }
    .cloud::after { width: 35%; height: 60%; right: 12%; top: -22%; }
    .cloud.one { width: 150px; height: 52px; left: -20%; top: 16%; animation-duration: 28s; animation-delay: -4s; }
    .cloud.two { width: 118px; height: 42px; left: -18%; top: 38%; animation-duration: 34s; animation-delay: -12s; }
    .cloud.three { width: 175px; height: 60px; left: -25%; top: 70%; animation-duration: 30s; animation-delay: -8s; }
    .cloud.four { width: 132px; height: 46px; left: -22%; top: 56%; animation-duration: 39s; animation-delay: -17s; }

    .floating-keyword {
      position: absolute;
      z-index: 2;
      padding: 10px 16px;
      background: rgba(255,255,255,0.92);
      color: #38638a;
      border-radius: 999px;
      border: 1px solid #d7e8f8;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 12px 26px rgba(95, 138, 183, 0.12);
      animation: bob 5.6s ease-in-out infinite;
    }
    .kw1 { left: 8%; top: 12%; animation-delay: 0s; }
    .kw2 { left: 14%; top: 58%; animation-delay: -1.4s; }
    .kw3 { right: 8%; top: 14%; animation-delay: -0.8s; }
    .kw4 { right: 11%; top: 61%; animation-delay: -2.2s; }
    .kw5 { left: 50%; transform: translateX(-50%); top: 8%; animation-delay: -1.8s; }
    .kw6 { left: 50%; transform: translateX(-50%); bottom: 10%; animation-delay: -3s; }
    .kw7 { left: 5%; top: 31%; animation-delay: -2.6s; }
    .kw8 { right: 5%; top: 38%; animation-delay: -3.8s; }

    .btn,
    .circle-btn,
    .topic-btn,
    .small-btn {
      border: 0;
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, box-shadow 0.22s ease, background 0.22s ease, filter 0.22s ease;
    }
    .btn:focus-visible,
    .circle-btn:focus-visible,
    .topic-btn:focus-visible,
    .small-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    .btn:active,
    .circle-btn:active,
    .topic-btn:active,
    .small-btn:active { transform: scale(0.97); }

    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 280px;
      min-height: 60px;
      padding: 16px 24px;
      border-radius: 18px;
      background: linear-gradient(120deg, #2479d8, #6f7bff, #22b5de);
      background-size: 220% 220%;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      display: block;
      margin: 0 auto;
      box-shadow: 0 14px 26px rgba(36, 121, 216, 0.22);
      animation: gradientFlow 6s ease infinite;
    }
    .btn::after,
    .circle-btn::after,
    .topic-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-135%) skewX(-25deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      transition: transform 0.7s ease;
      pointer-events: none;
    }
    .btn:hover,
    .circle-btn:hover,
    .topic-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 18px 30px rgba(36, 121, 216, 0.2);
    }
    .btn:hover::after,
    .circle-btn:hover::after,
    .topic-btn:hover::after { transform: translateX(135%) skewX(-25deg); }

    /* 두 번째 화면 */
    .selection-wrap {
      border-radius: 24px;
      background: linear-gradient(180deg, #f8fbff, #f2fbf6);
      border: 1px solid #e2ecf5;
      padding: 26px 18px 24px;
      min-height: 760px;
    }
    .page-title {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
      text-align: center;
      line-height: 1.3;
      letter-spacing: -0.03em;
    }
    .page-subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: var(--sub);
      font-size: 16px;
      line-height: 1.7;
    }
    .selection-area {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .orbital-panel,
    .art-panel {
      border: 1px solid #dceaf7;
      background: rgba(255,255,255,0.82);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(69, 112, 156, 0.08);
    }
    .orbital-board {
      position: relative;
      height: 560px;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 45%, #f6fbff 0%, #eef8ff 46%, #edf9f2 100%);
      border: 1px dashed #cfe2f2;
      overflow: hidden;
    }
    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(103, 146, 187, 0.22);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .ring.visible { opacity: 1; }
    .ring.r1 { width: 250px; height: 250px; }
    .ring.r2 { width: 350px; height: 350px; }
    .ring.r3 { width: 455px; height: 455px; }

    .center-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .center-duo {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      transition: all 0.45s ease;
    }
    .circle-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #eef7ff);
      border: 1px solid #d9e8f7;
      box-shadow: 0 12px 24px rgba(89, 130, 173, 0.12);
      color: var(--text);
    }
    .circle-btn .emoji {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 10px;
      animation: floatIcon 2.6s ease-in-out infinite;
    }
    .circle-btn .label {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .circle-btn.small {
      width: 118px;
      height: 118px;
    }
    .circle-btn.selected {
      width: 170px;
      height: 170px;
      background: linear-gradient(145deg, #2479d8, #5d8dff);
      color: #fff;
      box-shadow: 0 18px 34px rgba(36, 121, 216, 0.28);
      transform: scale(1.07);
    }
    .circle-btn.selected .label { font-size: clamp(32px, 4.5vw, 46px); }
    .circle-btn.dim {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
    }
    .back-switch {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 8;
      display: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #35506a;
      border: 1px solid #d8e8f6;
      box-shadow: 0 8px 20px rgba(73, 116, 159, 0.12);
      font-size: 14px;
      font-weight: 800;
    }
    .back-switch.show { display: inline-flex; align-items: center; gap: 6px; }

    .orbit-topic {
      position: absolute;
      left: 50%; top: 50%;
      width: 92px; height: 92px;
      margin-left: -46px; margin-top: -46px;
      opacity: 0;
      pointer-events: none;
      transform: translate(0,0) scale(0.4);
      transition: transform 0.55s cubic-bezier(.2,.7,.2,1.15), opacity 0.35s ease;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topic-btn {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #f2f9ff);
      border: 1px solid #d8e8f7;
      box-shadow: 0 12px 24px rgba(78, 119, 163, 0.12);
      color: #214b73;
      font-weight: 800;
      font-size: 16px;
      padding: 10px;
      text-align: center;
      line-height: 1.25;
    }
    .orbit-topic.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .topic-btn.active {
      background: linear-gradient(145deg, #2479d8, #62a4ff);
      color: #fff;
      box-shadow: 0 16px 28px rgba(36, 121, 216, 0.23);
    }
    .topic-btn .mini {
      display: block;
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .art-panel { display: flex; flex-direction: column; }
    .art-box {
      flex: 1;
      min-height: 560px;
      border-radius: 20px;
      background: linear-gradient(180deg, #f7fbff, #edf6ff);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .art-box h3 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
    }
    .art-box p {
      margin: 0 0 16px;
      font-size: 15px;
      color: var(--sub);
    }
    .art {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heroArtFloat 3.8s ease-in-out infinite;
    }
    .art svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 20px rgba(23, 50, 77, 0.10));
    }
    .art-enter { animation: popIn 0.55s ease both; }
    .art-sway { animation: sway 4.5s ease-in-out infinite; transform-origin: center center; }
    .art-spin { animation: spinSlow 7s linear infinite; transform-origin: center center; }
    .art-bounce { animation: bounceSoft 2.8s ease-in-out infinite; transform-origin: center center; }
    .art-blink { animation: blinkSoft 2.2s ease-in-out infinite; }

    .caption-chip {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #35506a;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #dbe8f5;
    }
    .placeholder {
      color: var(--sub);
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
    }
    .nav-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .small-btn {
      padding: 12px 18px;
      border-radius: 999px;
      background: #ffffff;
      color: #36526d;
      border: 1px solid #d7e6f4;
      box-shadow: 0 8px 18px rgba(65, 104, 145, 0.08);
      font-size: 14px;
      font-weight: 800;
    }
    .small-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(65,104,145,0.12); }

    @keyframes cloudFloat {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(60vw) translateY(-8px); }
      100% { transform: translateX(130vw) translateY(0); }
    }
    @keyframes bob {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .kw5, .kw6 { animation-name: bobCenter; }
    @keyframes bobCenter {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-12px); }
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes heroArtFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.82); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes sway {
      0%,100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bounceSoft {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blinkSoft {
      0%,45%,100% { opacity: 1; }
      50% { opacity: 0.35; }
      55% { opacity: 1; }
    }

    @media (max-width: 980px) {
      .selection-area { grid-template-columns: 1fr; }
      .art-box { min-height: 380px; }
      .orbital-board { height: 530px; }
    }
    @media (max-width: 680px) {
      .hero { min-height: 720px; padding: 18px; }
      .hero-inner { padding: 30px 18px 22px; }
      .floating-keyword { font-size: 12px; padding: 8px 12px; }
      .kw1 { left: 4%; top: 13%; }
      .kw2 { left: 4%; top: 58%; }
      .kw3 { right: 4%; top: 14%; }
      .kw4 { right: 2%; top: 60%; }
      .kw7 { left: 3%; top: 32%; }
      .kw8 { right: 1%; top: 38%; }
      .circle-btn { width: 118px; height: 118px; }
      .circle-btn .label { font-size: 28px; }
      .circle-btn.selected { width: 148px; height: 148px; }
      .orbit-topic { width: 78px; height: 78px; margin-left: -39px; margin-top: -39px; }
      .topic-btn { font-size: 13px; }
      .topic-btn .mini { display: none; }
      .orbital-board { height: 480px; }
      .ring.r1 { width: 196px; height: 196px; }
      .ring.r2 { width: 280px; height: 280px; }
      .ring.r3 { width: 360px; height: 360px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <!-- 첫 화면 -->
      <section class="screen active" id="homeScreen">
        <div class="hero">
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="cloud three"></div>
          <div class="cloud four"></div>

          <div class="floating-keyword kw1">창의적 사고 역량</div>
          <div class="floating-keyword kw2">생활 자립 역량</div>
          <div class="floating-keyword kw3">실천적 문제 해결 역량</div>
          <div class="floating-keyword kw4">의사소통 역량</div>
          <div class="floating-keyword kw5">2022 개정 기술·가정과 핵심역량</div>
          <div class="floating-keyword kw6">기술 시스템 설계 역량 · 공동체 역량</div>
          <div class="floating-keyword kw7">관계 형성 역량</div>
          <div class="floating-keyword kw8">협력적 소통 역량</div>

          <div class="hero-inner">
            <div class="hero-badge">☁️ 배움이 떠다니는 첫 화면</div>
            <h1>기술가정 수업하기</h1>
            <p>구름처럼 둥둥 떠다니는 핵심역량과 함께 기술과 가정을 쉽고 재미있게 배우는 수업 공간입니다.</p>
            <button type="button" class="btn" id="startButton">시작</button>
          </div>
        </div>
      </section>

      <!-- 두번째 화면 -->
      <section class="screen" id="selectionScreen">
        <div class="selection-wrap">
          <h2 class="page-title">과목 선택</h2>
          <p class="page-subtitle">기술 또는 가정을 선택하면 가운데가 커지고, 주변으로 주제 버튼이 동그랗게 펼쳐집니다.</p>

          <div class="selection-area">
            <div class="orbital-panel">
              <div class="orbital-board" id="orbitalBoard">
                <button type="button" class="back-switch" id="resetOrbitBtn">↺ 과목 다시 선택</button>
                <div class="ring r1" id="ring1"></div>
                <div class="ring r2" id="ring2"></div>
                <div class="ring r3" id="ring3"></div>

                <div class="center-stage">
                  <div class="center-duo" id="centerDuo">
                    <button type="button" class="circle-btn" id="techMainBtn">
                      <span class="emoji">⚙️</span>
                      <span class="label">기술</span>
                    </button>
                    <button type="button" class="circle-btn" id="homeMainBtn">
                      <span class="emoji">🏡</span>
                      <span class="label">가정</span>
                    </button>
                  </div>
                </div>

                <div id="orbitTopics"></div>
              </div>

              <div class="nav-row">
                <button type="button" class="small-btn" id="backToHomeBtn">처음으로</button>
              </div>
            </div>

            <div class="art-panel">
              <div class="art-box" id="artBox">
                <div class="placeholder">가운데에서 과목을 먼저 선택해보세요.<br>주제를 누르면 더 역동적으로 움직이는 그림이 나타납니다.</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const screens = {
      home: document.getElementById('homeScreen'),
      select: document.getElementById('selectionScreen')
    };
    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    const topics = {
      home: {
        title: '가정',
        emoji: '🏡',
        items: [

    const startButton = document.getElementById('startButton');
    const backToHomeBtn = document.getElementById('backToHomeBtn');
    const techMainBtn = document.getElementById('techMainBtn');
    const homeMainBtn = document.getElementById('homeMainBtn');
    const centerDuo = document.getElementById('centerDuo');
    const orbitTopics = document.getElementById('orbitTopics');
    const artBox = document.getElementById('artBox');
    const resetOrbitBtn = document.getElementById('resetOrbitBtn');
    const ringEls = [document.getElementById('ring1'), document.getElementById('ring2'), document.getElementById('ring3')];

    let currentMode = null;
    let activeTopic = null;

    function showArt(item) {
      artBox.innerHTML = `
        <div class="art-enter" style="width:100%; display:flex; flex-direction:column; align-items:center;">
          <h3>${item.text}</h3>
          <p>${item.info}</p>
          <div class="art">${item.art}</div>
          <div class="caption-chip">${item.artTitle}</div>
        </div>
      `;
    }

    function clearOrbit() {
      orbitTopics.innerHTML = '';
      ringEls.forEach(r => r.classList.remove('visible'));
      resetOrbitBtn.classList.remove('show');
      techMainBtn.classList.remove('selected','dim');
      homeMainBtn.classList.remove('selected','dim');
      centerDuo.style.transform = 'scale(1)';
      currentMode = null;
      activeTopic = null;
      artBox.innerHTML = '<div class="placeholder">가운데에서 과목을 먼저 선택해보세요.<br>주제를 누르면 더 역동적으로 움직이는 그림이 나타납니다.</div>';
    }

    function activateMode(mode) {
      currentMode = mode;
      activeTopic = null;
      const selectedBtn = mode === 'tech' ? techMainBtn : homeMainBtn;
      const otherBtn = mode === 'tech' ? homeMainBtn : techMainBtn;

      selectedBtn.classList.add('selected');
      otherBtn.classList.add('dim');
      resetOrbitBtn.classList.add('show');
      centerDuo.style.transform = 'scale(1.02)';

      orbitTopics.innerHTML = '';
      const items = topics[mode].items;
      const mobile = window.innerWidth <= 680;
      const baseRadius = mobile ? 122 : 170;
      const extraRadius = mobile ? 42 : 55;
      const total = items.length;

      ringEls.forEach((r, idx) => {
        r.classList.toggle('visible', idx < Math.ceil(total/3));
      });

      items.forEach((item, index) => {
        const wrap = document.createElement('div');
        wrap.className = 'orbit-topic';
        const angle = (-90 + index * (360 / total)) * Math.PI / 180;
        const radius = total <= 6 ? baseRadius : (index % 2 === 0 ? baseRadius : baseRadius + extraRadius);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        wrap.dataset.x = x.toFixed(1);
        wrap.dataset.y = y.toFixed(1);
        wrap.innerHTML = `<button type="button" class="topic-btn"><span>${item.text}</span><span class="mini">주제</span></button>`;
        const btn = wrap.querySelector('button');
        btn.addEventListener('click', () => {
          document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTopic = item.text;
          showArt(item);
        });
        orbitTopics.appendChild(wrap);
        requestAnimationFrame(() => {
          setTimeout(() => {
            wrap.classList.add('visible');
            wrap.style.transform = `translate(${x}px, ${y}px) scale(1)`;
          }, 60 * index);
        });
      });

      if (items[0]) {
        setTimeout(() => {
          const firstBtn = orbitTopics.querySelector('.topic-btn');
          if (firstBtn) firstBtn.click();
        }, 420);
      }
    }

    startButton.addEventListener('click', () => {
      showScreen('select');
      clearOrbit();
    });
    backToHomeBtn.addEventListener('click', () => showScreen('home'));
    resetOrbitBtn.addEventListener('click', clearOrbit);
    techMainBtn.addEventListener('click', () => activateMode('tech'));
    homeMainBtn.addEventListener('click', () => activateMode('home'));
    window.addEventListener('resize', () => { if (currentMode) activateMode(currentMode); });
  </script>
