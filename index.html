<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기술가정 수업하기</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg1: #eaf5ff;
      --bg2: #edfdf5;
      --card: #ffffff;
      --text: #17324d;
      --sub: #52677a;
      --primary: #2479d8;
      --primary-dark: #1764b9;
      --soft: #eef5ff;
      --soft-border: #d9e6f5;
      --accent: #ffbd42;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .panel {
      width: 100%;
      max-width: 980px;
      padding: 24px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(25, 65, 105, 0.12);
    }
    .screen { display: none; }
    .screen.active { display: block; }

    .hero {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 8px;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.3;
      word-break: keep-all;
    }
    h2 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.3;
      word-break: keep-all;
      text-align: center;
    }
    p {
      margin: 0 0 28px;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.7;
      color: var(--sub);
      word-break: keep-all;
      text-align: center;
    }
    .btn,
    .grid-btn {
      border: 0;
      border-radius: 16px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:active,
    .grid-btn:active { transform: scale(0.98); }
    .btn:focus-visible,
    .grid-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    .btn {
      width: 100%;
      max-width: 280px;
      min-height: 56px;
      padding: 14px 20px;
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: block;
      margin: 0 auto;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary {
      background: var(--soft);
      color: var(--primary-dark);
    }
    .btn.secondary:hover { background: #dfeeff; }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 560px;
      margin: 24px auto 12px;
    }
    .subject-card {
      min-height: 140px;
      padding: 18px;
      border: 1px solid var(--soft-border);
      border-radius: 20px;
      background: linear-gradient(180deg, #f9fcff, #f0f7ff);
      color: var(--text);
      text-align: center;
      font-size: clamp(34px, 6vw, 42px);
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(36, 121, 216, 0.08);
    }
    .subject-card small {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--sub);
      font-weight: 500;
    }
    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(36, 121, 216, 0.14);
    }

    .category-layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 22px;
      align-items: start;
    }
    .category-panel,
    .art-panel {
      border: 1px solid var(--soft-border);
      border-radius: 20px;
      padding: 18px;
      background: #fbfdff;
    }
    .section-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.4;
    }
    .section-desc {
      margin: 0 0 16px;
      color: var(--sub);
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid-btn {
      min-height: 62px;
      padding: 12px 10px;
      background: #eef5ff;
      color: #18456f;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid #d7e7fb;
    }
    .grid-btn:hover {
      background: #dfeeff;
      box-shadow: 0 6px 16px rgba(36, 121, 216, 0.12);
    }
    .grid-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .art-box {
      min-height: 430px;
      border-radius: 18px;
      background: linear-gradient(180deg, #f6fbff, #edf6ff);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .art-box h3 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .art-box p {
      margin: 0 0 18px;
      font-size: 15px;
      color: var(--sub);
      text-align: center;
    }
    .art {
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 16px rgba(23, 50, 77, 0.08));
    }
    .placeholder {
      color: var(--sub);
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
    }
    .nav-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .caption-chip {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #35506a;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #dbe8f5;
    }


    /* 그래픽 모션 버튼: 움직이는 배경, 떠오름, 클릭 반응 */
    .btn, .grid-btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .btn::after, .grid-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 15%, rgba(255,255,255,.48) 45%, transparent 70%);
      transform: translateX(-155%);
    }
    .btn:hover::after, .grid-btn:hover::after {
      animation: shine .7s ease-out 1;
    }
    .btn:hover, .grid-btn:hover { transform: translateY(-4px); }
    .btn:active, .grid-btn:active { transform: translateY(1px) scale(.96); }
    .btn:not(.secondary) {
      background: linear-gradient(125deg, #2479d8, #6555d9, #2479d8);
      background-size: 230% 230%;
      animation: colorFlow 6s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(36,121,216,.28);
    }
    .btn:not(.secondary):hover { box-shadow: 0 14px 28px rgba(36,121,216,.36); }
    .subject-card.grid-btn {
      padding: 22px 14px;
      border: 2px solid #dbe9ff;
      background: linear-gradient(140deg, #edf8ff, #eeeaff, #f0fff8);
      background-size: 230% 230%;
      animation: colorFlow 8s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(46,91,160,.12);
    }
    .subject-card.grid-btn::before {
      display: block;
      margin: 0 auto 8px;
      font-size: 40px;
      line-height: 1.2;
      animation: iconFloat 2.8s ease-in-out infinite;
    }
    #techButton::before { content: "⚙️"; }
    #homeEcButton::before { content: "🏡"; animation-delay: -.8s; }
    .subject-card.grid-btn:hover { box-shadow: 0 14px 30px rgba(46,91,160,.22); }
    .subject-card.grid-btn.active { color: var(--text); }
    #categoryGrid .grid-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 98px;
      background: linear-gradient(140deg,#f5f9ff,#e8efff);
      box-shadow: 0 5px 14px rgba(36,121,216,.1);
    }
    #categoryGrid .grid-btn:nth-child(3n+2) { background: linear-gradient(140deg,#f3fff8,#e8f6ec); }
    #categoryGrid .grid-btn:nth-child(3n) { background: linear-gradient(140deg,#fff9ef,#ffeedc); }
    #categoryGrid .grid-btn.active {
      background: linear-gradient(120deg, #2479d8, #6555d9);
      color: #fff;
      box-shadow: 0 10px 24px rgba(56,93,205,.27);
    }
    .topic-icon { font-size: 28px; line-height: 1.25; display: inline-block; animation: iconFloat 3.2s ease-in-out infinite; }
    #categoryGrid .grid-btn:nth-child(even) .topic-icon { animation-delay: -1.3s; }
    #categoryGrid .grid-btn:hover .topic-icon { animation: iconPop .42s ease-in-out; }
    @keyframes iconFloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
    @keyframes iconPop { 0%,100% { transform: scale(1); } 45% { transform: scale(1.23) rotate(8deg); } }
    @keyframes colorFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes shine { from { transform: translateX(-155%); } to { transform: translateX(155%); } }
    @media (prefers-reduced-motion: reduce) {
      .btn, .grid-btn, .subject-card.grid-btn, .subject-card.grid-btn::before, .topic-icon { animation: none !important; transition: none !important; }
      .btn:hover::after, .grid-btn:hover::after { animation: none !important; }
    }

    @media (max-width: 860px) {
      .category-layout {
        grid-template-columns: 1fr;
      }
      .art-box { min-height: 360px; }
    }
    @media (max-width: 560px) {
      .panel { padding: 18px; border-radius: 20px; }
      .subject-grid,
      .category-grid { grid-template-columns: 1fr; }
      .subject-card { min-height: 120px; }
      .art-box { min-height: 320px; }
      .art { max-width: 240px; }
    }

    /* 두 번째 화면에서 세부 주제를 펼치는 구조 */
    .topic-area[hidden] { display: none !important; }
    .topic-area {
      margin: 26px auto 0;
      padding-top: 24px;
      border-top: 1px solid #dbe8f5;
      animation: reveal .42s cubic-bezier(.2,.75,.2,1) both;
    }
    .topic-area .section-title, .topic-area .section-desc { text-align: center; }
    .topic-area .section-desc { margin-bottom: 18px; }
    .topic-area .category-grid {
      grid-template-columns: repeat(4, minmax(0,1fr));
      margin-bottom: 20px;
    }
    .subject-card.grid-btn.chosen {
      border-color: #587be9;
      box-shadow: 0 0 0 3px rgba(88,123,233,.16), 0 14px 26px rgba(46,91,160,.17);
    }
    .topic-area #categoryGrid .grid-btn {
      animation: reveal .42s both;
      animation-delay: calc(var(--order) * 45ms);
    }
    .art-panel { max-width: 660px; margin: 0 auto; }
    .art-box { min-height: 375px; }
    /* 그림 전체 및 개별 도형이 서로 다른 리듬으로 움직이도록 설정 */
    .art { animation: artAppear .65s cubic-bezier(.2,.85,.25,1) both, artHover 3.8s ease-in-out .65s infinite; }
    .art svg > :not(rect):not(ellipse):not(svg) { transform-box: fill-box; transform-origin: center; }
    .art svg > path:nth-child(3n+1), .art svg > circle:nth-child(3n+1) { animation: artWiggle 2.6s ease-in-out infinite alternate; }
    .art svg > path:nth-child(3n+2), .art svg > circle:nth-child(3n+2) { animation: artPulse 3.4s ease-in-out infinite; }
    .art svg > g { transform-box: fill-box; transform-origin: center; animation: artRotate 9s ease-in-out infinite; }
    .art-box h3 { animation: reveal .38s both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(15px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes artAppear { from { opacity:0; transform:translateY(22px) scale(.82) rotate(-5deg); } to { opacity:1; transform:translateY(0) scale(1) rotate(0deg); } }
    @keyframes artHover { 0%,100% { transform:translateY(0) rotate(-1.5deg); } 50% { transform:translateY(-14px) rotate(2deg); } }
    @keyframes artWiggle { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(-3px); } }
    @keyframes artPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }
    @keyframes artRotate { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(7deg); } }
    @media (max-width: 700px) { .topic-area .category-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 420px) { .topic-area #categoryGrid .grid-btn { min-height: 85px; font-size:14px; } }
    @media (prefers-reduced-motion: reduce) {
      .topic-area, .topic-area #categoryGrid .grid-btn, .art, .art svg > *, .art-box h3 { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <section class="screen active" id="homeScreen">
        <div class="hero">
          <h1>기술가정 수업하기</h1>
          <p>기술과 가정을 쉽고 재미있게 배우는 수업 공간입니다.</p>
          <button type="button" class="btn" id="startButton">시작</button>
        </div>
      </section>

      <section class="screen" id="subjectScreen">
        <h2>과목 선택</h2>
        <p>기술 또는 가정을 눌러 주제를 살펴보세요.</p>
        <div class="subject-grid">
          <button type="button" class="subject-card grid-btn" id="techButton" aria-expanded="false" aria-controls="topicArea">기술</button>
          <button type="button" class="subject-card grid-btn" id="homeEcButton" aria-expanded="false" aria-controls="topicArea">가정</button>
        </div>

        <!-- 과목을 선택하면 같은 두 번째 화면 안에 세부 주제가 펼쳐집니다. -->
        <div id="topicArea" class="topic-area" hidden>
          <h3 class="section-title" id="categoryTitle">주제 선택</h3>
          <p class="section-desc" id="categoryDesc"></p>
          <div class="category-grid" id="categoryGrid"></div>
          <div class="art-panel" id="artPanel" aria-live="polite">
            <div class="art-box" id="artBox">
              <div class="placeholder">보고 싶은 주제를 선택해 주세요.</div>
            </div>
          </div>
        </div>
        <div class="nav-row">
          <button type="button" class="btn secondary" id="backToHome">처음으로</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const screens = {
      home: document.getElementById('homeScreen'),
      subject: document.getElementById('subjectScreen')
    };

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    const topics = {

          {

          {

            artTitle: '가족 그림',
            art: `

                <path d="M71 90C74 84 82 82 86 87" fill="none" stroke="#6F513E" stroke-width="3" stroke-linecap="round"/>
                <path d="M112 73C116 66 126 66 130 73" fill="none" stroke="#6F513E" stroke-width="3" stroke-linecap="round"/>
                <path d="M157 89C160 84 167 84 170 89" fill="none" stroke="#6F513E" stroke-width="3" stroke-linecap="round"/>
              </svg>`
          },
          {
            key: '소비',
            text: '소비',
            info: '합리적인 소비생활과 용돈 관리, 구매 판단을 배우는 주제예요.',
            artTitle: '소비 그림',
            art: `
              <svg viewBox="0 0 240 240" aria-label="소비 그림" xmlns="http://www.w3.org/2000/svg">

      '소비': '🛍️', '발달': '🌱', '기술': '⚙️', '발명': '💡',
      '재료제작': '🛠️', '친환경에너지': '🌞', '수송기술': '🚗',
      '건설기술': '🏗️', '정보통신기술': '💻', '생명기술': '🧬'
    };

    const categoryTitle = document.getElementById('categoryTitle');
    const categoryDesc = document.getElementById('categoryDesc');
    const categoryGrid = document.getElementById('categoryGrid');
    const artBox = document.getElementById('artBox');

    function renderArt(item) {
      artBox.innerHTML = `
        <h3>${item.text}</h3>
        <p>${item.info}</p>
        <div class="art">${item.art}</div>
        <div class="caption-chip">${item.artTitle}</div>
      `;
    }

    function renderCategoryScreen(mode) {
      const data = topics[mode];
      const area = document.getElementById('topicArea');
      area.hidden = false;
      document.getElementById('techButton').classList.toggle('chosen', mode === 'tech');
      document.getElementById('homeEcButton').classList.toggle('chosen', mode === 'home');
      document.getElementById('techButton').setAttribute('aria-expanded', String(mode === 'tech'));
      document.getElementById('homeEcButton').setAttribute('aria-expanded', String(mode === 'home'));
      categoryTitle.textContent = data.title;
      categoryDesc.textContent = data.desc;
      categoryGrid.replaceChildren();
      artBox.innerHTML = '<div class="placeholder">아래 주제 버튼을 눌러 그림을 살펴보세요.</div>';

      data.items.forEach((item, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'grid-btn';
        button.style.setProperty('--order', index);
        const icon = document.createElement('span');
        icon.className = 'topic-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = topicIcons[item.key] || '✨';
        const label = document.createElement('span');
        label.textContent = item.text;
        button.append(icon, label);
        button.addEventListener('click', () => {
          categoryGrid.querySelectorAll('.grid-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          renderArt(item);
        });
        categoryGrid.appendChild(button);
      });
    }

    document.getElementById('startButton').addEventListener('click', () => showScreen('subject'));
    document.getElementById('backToHome').addEventListener('click', () => showScreen('home'));
    document.getElementById('techButton').addEventListener('click', () => renderCategoryScreen('tech'));
    document.getElementById('homeEcButton').addEventListener('click', () => renderCategoryScreen('home'));
