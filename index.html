<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기술가정 수업하기</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --sky-top: #bfe7ff;
      --sky-mid: #dff3ff;
      --sky-bottom: #f6fcff;
      --card: #ffffff;
      --text: #17324d;
      --sub: #52677a;
      --primary: #2479d8;
      --primary-dark: #1764b9;
      --soft: #eef5ff;
      --soft-border: #d9e6f5;
      --accent: #ffbd42;
      --shadow: 0 14px 40px rgba(25, 65, 105, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(180deg, #9cdcff 0%, #c9ecff 22%, #e7f7ff 58%, #f8fdff 100%);
      color: var(--text);
      overflow-x: hidden;
    }
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .panel {
      width: 100%;
      max-width: 1180px;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(5px);
      box-shadow: var(--shadow);
    }
    .screen { display: none; }
    .screen.active { display: block; }

    /* 공통 버튼 */
    .btn,
    .circle-btn,
    .topic-btn,
    .small-btn,
    .competency-cloud {
      border: 0;
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, box-shadow 0.22s ease, background 0.22s ease, filter 0.22s ease;
    }
    .btn:focus-visible,
    .circle-btn:focus-visible,
    .topic-btn:focus-visible,
    .small-btn:focus-visible,
    .competency-cloud:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    .btn:active,
    .circle-btn:active,
    .topic-btn:active,
    .small-btn:active,
    .competency-cloud:active { transform: scale(0.97); }

    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 280px;
      min-height: 60px;
      padding: 16px 24px;
      border-radius: 18px;
      background: linear-gradient(120deg, #2479d8, #6f7bff, #22b5de);
      background-size: 220% 220%;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      display: block;
      margin: 0 auto;
      box-shadow: 0 14px 26px rgba(36, 121, 216, 0.22);
      animation: gradientFlow 6s ease infinite;
    }
    .btn::after,
    .circle-btn::after,
    .topic-btn::after,
    .competency-cloud::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-135%) skewX(-25deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      transition: transform 0.7s ease;
      pointer-events: none;
    }
    .btn:hover,
    .circle-btn:hover,
    .topic-btn:hover,
    .competency-cloud:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 18px 30px rgba(36, 121, 216, 0.2);
    }
    .btn:hover::after,
    .circle-btn:hover::after,
    .topic-btn:hover::after,
    .competency-cloud:hover::after { transform: translateX(135%) skewX(-25deg); }

    /* 첫 화면 */
    .hero {
      position: relative;
      min-height: 730px;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,0.65) 0 7%, transparent 8%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.5) 0 6%, transparent 7%),
        linear-gradient(180deg, #95d8ff 0%, #beeaff 28%, #e6f7ff 70%, #f7fcff 100%);
      border: 1px solid #d6edf9;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sky-cloud {
      position: absolute;
      z-index: 1;
      opacity: 0.92;
      animation: drift linear infinite;
      will-change: transform;
      filter: drop-shadow(0 10px 18px rgba(120, 157, 193, 0.10));
    }
    .sky-cloud svg { display: block; width: 100%; height: auto; }
    .sky-cloud.one { width: 220px; left: -18%; top: 9%; animation-duration: 34s; animation-delay: -3s; }
    .sky-cloud.two { width: 170px; left: -14%; top: 30%; animation-duration: 40s; animation-delay: -14s; }
    .sky-cloud.three { width: 260px; left: -22%; top: 60%; animation-duration: 38s; animation-delay: -8s; }
    .sky-cloud.four { width: 150px; left: -16%; top: 79%; animation-duration: 44s; animation-delay: -19s; }
    .sky-cloud.five { width: 200px; left: -20%; top: 46%; animation-duration: 48s; animation-delay: -24s; }

    .hero-content {
      position: relative;
      z-index: 5;
      width: 100%;
      min-height: 660px;
    }

    .title-cloud {
      position: relative;
      width: min(100%, 620px);
      margin: 0 auto 24px;
      padding: 48px 32px 36px;
      text-align: center;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d7ebfa;
      box-shadow: 0 16px 38px rgba(71, 116, 164, 0.12);
      border-radius: 110px;
      z-index: 4;
      animation: titleFloat 5.4s ease-in-out infinite;
    }
    .title-cloud::before,
    .title-cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d7ebfa;
      border-radius: 50%;
      z-index: -1;
    }
    .title-cloud::before {
      width: 140px; height: 110px;
      left: 26px; top: -40px;
      box-shadow: 0 10px 18px rgba(71,116,164,0.08);
    }
    .title-cloud::after {
      width: 170px; height: 128px;
      right: 30px; top: -52px;
      box-shadow: 0 10px 18px rgba(71,116,164,0.08);
    }
    .title-cloud .puff-a,
    .title-cloud .puff-b {
      position: absolute;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d7ebfa;
      border-radius: 50%;
      z-index: -1;
      box-shadow: 0 10px 18px rgba(71,116,164,0.08);
    }
    .title-cloud .puff-a { width: 92px; height: 74px; left: -8px; top: 24px; }
    .title-cloud .puff-b { width: 94px; height: 76px; right: -12px; top: 36px; }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.18;
      word-break: keep-all;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 24px;
      font-size: clamp(15px, 3.8vw, 18px);
      line-height: 1.7;
      color: var(--sub);
      word-break: keep-all;
      text-align: center;
    }

    .cloud-field {
      position: relative;
      min-height: 290px;
      margin: 10px auto 28px;
    }

    .competency-cloud {
      position: absolute;
      padding: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
      animation: cloudBob 5.3s ease-in-out infinite;
    }
    .competency-cloud .cloud-shape {
      position: relative;
      min-width: 120px;
      padding: 18px 22px;
      background: rgba(255,255,255,0.95);
      border: 1px solid #d7ebfa;
      border-radius: 999px;
      box-shadow: 0 14px 24px rgba(93, 136, 176, 0.12);
      color: #355e86;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
    }
    .competency-cloud .cloud-shape::before,
    .competency-cloud .cloud-shape::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      border: 1px solid #d7ebfa;
      border-radius: 50%;
      z-index: -1;
    }
    .competency-cloud .cloud-shape::before {
      width: 44px; height: 38px; left: 12px; top: -16px;
    }
    .competency-cloud .cloud-shape::after {
      width: 52px; height: 42px; right: 16px; top: -18px;
    }
    .competency-cloud.active .cloud-shape {
      background: linear-gradient(180deg, #ffffff, #eef8ff);
      border-color: #7ec7ff;
      color: #21649a;
      transform: scale(1.06);
      box-shadow: 0 18px 30px rgba(77, 143, 194, 0.18);
    }
    .competency-cloud.k1 { left: 4%; top: 10%; animation-delay: 0s; }
    .competency-cloud.k2 { left: 12%; top: 58%; animation-delay: -1.2s; }
    .competency-cloud.k3 { right: 4%; top: 13%; animation-delay: -0.6s; }
    .competency-cloud.k4 { right: 10%; top: 59%; animation-delay: -2.1s; }
    .competency-cloud.k5 { left: 50%; top: 0%; transform: translateX(-50%); animation-name: cloudBobCenter; animation-delay: -1.5s; }
    .competency-cloud.k6 { left: 50%; bottom: 1%; transform: translateX(-50%); animation-name: cloudBobCenter; animation-delay: -2.7s; }
    .competency-cloud.k7 { left: 0%; top: 34%; animation-delay: -2.6s; }
    .competency-cloud.k8 { right: 0%; top: 34%; animation-delay: -3.6s; }

    .competency-display {
      width: min(100%, 540px);
      margin: 0 auto;
      position: relative;
      min-height: 150px;
      z-index: 4;
    }
    .action-cloud {
      position: relative;
      min-height: 150px;
      padding: 32px 28px 26px;
      background: rgba(255,255,255,0.97);
      border: 1px solid #cfe8fa;
      border-radius: 110px;
      box-shadow: 0 20px 40px rgba(84, 130, 174, 0.15);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      animation: actionPop 0.55s ease, actionFloat 4.2s ease-in-out infinite 0.55s;
    }
    .action-cloud.show { display: flex; }
    .action-cloud::before,
    .action-cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.97);
      border: 1px solid #cfe8fa;
      border-radius: 50%;
      z-index: -1;
      box-shadow: 0 12px 20px rgba(84, 130, 174, 0.08);
    }
    .action-cloud::before { width: 130px; height: 100px; left: 25px; top: -34px; }
    .action-cloud::after { width: 145px; height: 112px; right: 24px; top: -42px; }
    .action-cloud .puff1,
    .action-cloud .puff2 {
      position: absolute;
      background: rgba(255,255,255,0.97);
      border: 1px solid #cfe8fa;
      border-radius: 50%;
      z-index: -1;
      box-shadow: 0 12px 20px rgba(84, 130, 174, 0.08);
    }
    .action-cloud .puff1 { width: 80px; height: 68px; left: -8px; bottom: 25px; }
    .action-cloud .puff2 { width: 88px; height: 72px; right: -10px; bottom: 28px; }
    .action-icon {
      font-size: 32px;
      margin-bottom: 8px;
      animation: sparklePop 1.8s ease-in-out infinite;
    }
    .action-title {
      margin: 0 0 6px;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 900;
      color: #1f5d92;
    }
    .action-desc {
      margin: 0;
      font-size: 15px;
      color: #4c6984;
      line-height: 1.7;
    }
    .orbit-sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8b1 0%, #ffd666 58%, rgba(255,214,102,0) 62%);
      animation: sparkleOrbit 3s linear infinite;
      pointer-events: none;
    }
    .s1 { top: 8px; left: 18%; animation-delay: 0s; }
    .s2 { top: 24px; right: 18%; animation-delay: -1s; }
    .s3 { bottom: 18px; left: 50%; animation-delay: -2s; }

    /* 두번째 화면 */
    .selection-wrap {
      border-radius: 24px;
      background: linear-gradient(180deg, #f8fbff, #f2fbf6);
      border: 1px solid #e2ecf5;
      padding: 26px 18px 24px;
      min-height: 760px;
    }
    .page-title {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
      text-align: center;
      line-height: 1.3;
      letter-spacing: -0.03em;
    }
    .page-subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: var(--sub);
      font-size: 16px;
      line-height: 1.7;
    }
    .selection-area {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .orbital-panel,
    .art-panel {
      border: 1px solid #dceaf7;
      background: rgba(255,255,255,0.82);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(69, 112, 156, 0.08);
    }
    .orbital-board {
      position: relative;
      height: 560px;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 45%, #f6fbff 0%, #eef8ff 46%, #edf9f2 100%);
      border: 1px dashed #cfe2f2;
      overflow: hidden;
    }
    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(103, 146, 187, 0.22);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .ring.visible { opacity: 1; }
    .ring.r1 { width: 250px; height: 250px; }
    .ring.r2 { width: 350px; height: 350px; }
    .ring.r3 { width: 455px; height: 455px; }

    .center-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .center-duo {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      transition: all 0.45s ease;
    }
    .circle-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #eef7ff);
      border: 1px solid #d9e8f7;
      box-shadow: 0 12px 24px rgba(89, 130, 173, 0.12);
      color: var(--text);
    }
    .circle-btn .emoji {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 10px;
      animation: floatIcon 2.6s ease-in-out infinite;
    }
    .circle-btn .label {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .circle-btn.selected {
      width: 170px;
      height: 170px;
      background: linear-gradient(145deg, #2479d8, #5d8dff);
      color: #fff;
      box-shadow: 0 18px 34px rgba(36, 121, 216, 0.28);
      transform: scale(1.07);
    }
    .circle-btn.selected .label { font-size: clamp(32px, 4.5vw, 46px); }
    .circle-btn.dim {
      /* 선택하지 않은 과목은 레이아웃에서도 제외해
         선택한 과목이 원형 메뉴의 정확한 중앙에 오도록 합니다. */
      display: none;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
    }
    .back-switch {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 8;
      display: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #35506a;
      border: 1px solid #d8e8f6;
      box-shadow: 0 8px 20px rgba(73, 116, 159, 0.12);
      font-size: 14px;
      font-weight: 800;
    }
    .back-switch.show { display: inline-flex; align-items: center; gap: 6px; }

    .orbit-topic {
      position: absolute;
      left: 50%; top: 50%;
      width: 92px; height: 92px;
      margin-left: -46px; margin-top: -46px;
      opacity: 0;
      pointer-events: none;
      transform: translate(0,0) scale(0.4);
      transition: transform 0.55s cubic-bezier(.2,.7,.2,1.15), opacity 0.35s ease;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topic-btn {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #f2f9ff);
      border: 1px solid #d8e8f7;
      box-shadow: 0 12px 24px rgba(78, 119, 163, 0.12);
      color: #214b73;
      font-weight: 800;
      font-size: 16px;
      padding: 10px;
      text-align: center;
      line-height: 1.25;
    }
    .orbit-topic.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .topic-btn.active {
      background: linear-gradient(145deg, #2479d8, #62a4ff);
      color: #fff;
      box-shadow: 0 16px 28px rgba(36, 121, 216, 0.23);
    }
    .topic-btn .mini {
      display: block;
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .art-panel { display: flex; flex-direction: column; }
    .art-box {
      flex: 1;
      min-height: 560px;
      border-radius: 20px;
      background: linear-gradient(180deg, #f7fbff, #edf6ff);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .art-box h3 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
    }
    .art-box p {
      margin: 0 0 16px;
      font-size: 15px;
      color: var(--sub);
    }
    .art {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heroArtFloat 3.8s ease-in-out infinite;
    }
    .art svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 20px rgba(23, 50, 77, 0.10));
    }
    .art-enter { animation: popIn 0.55s ease both; }
    .art-sway { animation: sway 4.5s ease-in-out infinite; transform-origin: center center; }
    .art-spin { animation: spinSlow 7s linear infinite; transform-origin: center center; }
    .art-bounce { animation: bounceSoft 2.8s ease-in-out infinite; transform-origin: center center; }
    .art-blink { animation: blinkSoft 2.2s ease-in-out infinite; }

    .caption-chip {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #35506a;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #dbe8f5;
    }
    .placeholder {
      color: var(--sub);
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
    }
    .nav-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .small-btn {
      padding: 12px 18px;
      border-radius: 999px;
      background: #ffffff;
      color: #36526d;
      border: 1px solid #d7e6f4;
      box-shadow: 0 8px 18px rgba(65, 104, 145, 0.08);
      font-size: 14px;
      font-weight: 800;
    }
    .small-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(65,104,145,0.12); }

    @keyframes drift {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(60vw) translateY(-10px); }
      100% { transform: translateX(130vw) translateY(0); }
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes cloudBob {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes cloudBobCenter {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-12px); }
    }
    @keyframes titleFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes actionPop {
      0% { opacity: 0; transform: scale(0.78) rotate(-3deg); }
      70% { opacity: 1; transform: scale(1.04) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes actionFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes sparkleOrbit {
      0% { transform: translateY(0) scale(0.8); opacity: 0.6; }
      50% { transform: translateY(-10px) scale(1.15); opacity: 1; }
      100% { transform: translateY(0) scale(0.8); opacity: 0.6; }
    }
    @keyframes sparklePop {
      0%,100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.16) rotate(8deg); }
    }
    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes heroArtFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.82); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes sway {
      0%,100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bounceSoft {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blinkSoft {
      0%,45%,100% { opacity: 1; }
      50% { opacity: 0.35; }
      55% { opacity: 1; }
    }

    @media (max-width: 980px) {
      .selection-area { grid-template-columns: 1fr; }
      .art-box { min-height: 380px; }
      .orbital-board { height: 530px; }
      .cloud-field { min-height: 350px; }
    }
    @media (max-width: 760px) {

          { text: '생명기술', info: '생명과학을 바탕으로 한 기술과 활용을 배우는 주제예요.', artTitle: '생명기술 그림', art: `<svg viewBox="0 0 240 240" aria-label="생명기술 그림" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="240" rx="32" fill="#EEFBEF"/><ellipse cx="120" cy="198" rx="72" ry="10" fill="#DDEDDD"/><g class="art-sway"><path d="M92 62C70 78 65 104 80 126C95 147 116 150 120 170C124 150 145 147 160 126C175 104 170 78 148 62" fill="none" stroke="#4AA86A" stroke-width="8" stroke-linecap="round"/><path d="M92 62C99 78 111 92 120 104C129 92 141 78 148 62" fill="none" stroke="#4AA86A" stroke-width="8" stroke-linecap="round"/><path d="M120 52V188" stroke="#4AA86A" stroke-width="6" stroke-linecap="round"/></g><g class="art-bounce"><circle cx="79" cy="175" r="21" fill="#BFE8FF" stroke="#43739A" stroke-width="5"/><circle cx="163" cy="175" r="21" fill="#FFD7E4" stroke="#9A4963" stroke-width="5"/></g><g class="art-blink"><path d="M79 163V187M67 175H91" stroke="#43739A" stroke-width="5" stroke-linecap="round"/><path d="M151 175H175" stroke="#9A4963" stroke-width="5" stroke-linecap="round"/></g></svg>`}

    const startButton = document.getElementById('startButton');
    const backToHomeBtn = document.getElementById('backToHomeBtn');
    const techMainBtn = document.getElementById('techMainBtn');
    const homeMainBtn = document.getElementById('homeMainBtn');
    const centerDuo = document.getElementById('centerDuo');
    const orbitTopics = document.getElementById('orbitTopics');
    const artBox = document.getElementById('artBox');
    const resetOrbitBtn = document.getElementById('resetOrbitBtn');
    const ringEls = [document.getElementById('ring1'), document.getElementById('ring2'), document.getElementById('ring3')];

    const competencyButtons = document.querySelectorAll('.competency-cloud');
    const actionCloud = document.getElementById('actionCloud');
    const actionIcon = document.getElementById('actionIcon');
    const actionTitle = document.getElementById('actionTitle');
    const actionDesc = document.getElementById('actionDesc');

    let currentMode = null;

    function showCompetencyAction(button) {
      competencyButtons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      actionIcon.textContent = button.dataset.icon || '☁️';
      actionTitle.textContent = button.dataset.title || '';
      actionDesc.textContent = button.dataset.desc || '';
      actionCloud.classList.remove('show');
      void actionCloud.offsetWidth;
      actionCloud.classList.add('show');
    }

    competencyButtons.forEach((button, index) => {
      button.addEventListener('click', () => showCompetencyAction(button));
      if (index === 4) {
        window.addEventListener('load', () => setTimeout(() => showCompetencyAction(button), 250));
      }
    });

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    function showArt(item) {
      artBox.innerHTML = `
        <div class="art-enter" style="width:100%; display:flex; flex-direction:column; align-items:center;">
          <h3>${item.text}</h3>
          <p>${item.info}</p>
          <div class="art">${item.art}</div>
          <div class="caption-chip">${item.artTitle}</div>
        </div>
      `;
    }

    function clearOrbit() {
      orbitTopics.innerHTML = '';
      ringEls.forEach(r => r.classList.remove('visible'));
      resetOrbitBtn.classList.remove('show');
      techMainBtn.classList.remove('selected','dim');
      homeMainBtn.classList.remove('selected','dim');
      centerDuo.style.transform = 'scale(1)';
      currentMode = null;
      artBox.innerHTML = '<div class="placeholder">가운데에서 과목을 먼저 선택해보세요.<br>주제를 누르면 더 역동적으로 움직이는 그림이 나타납니다.</div>';
    }

    function activateMode(mode) {
      currentMode = mode;
      const selectedBtn = mode === 'tech' ? techMainBtn : homeMainBtn;
      const otherBtn = mode === 'tech' ? homeMainBtn : techMainBtn;

      selectedBtn.classList.add('selected');
      otherBtn.classList.add('dim');
      resetOrbitBtn.classList.add('show');
      centerDuo.style.transform = 'scale(1.02)';

      orbitTopics.innerHTML = '';
      const items = topics[mode].items;
      const mobile = window.innerWidth <= 760;
      const baseRadius = mobile ? 122 : 170;
      const extraRadius = mobile ? 42 : 55;
      const total = items.length;

      ringEls.forEach((r, idx) => {
        r.classList.toggle('visible', idx < Math.ceil(total / 3));
      });

      items.forEach((item, index) => {
        const wrap = document.createElement('div');
        wrap.className = 'orbit-topic';
        const angle = (-90 + index * (360 / total)) * Math.PI / 180;
        const radius = total <= 6 ? baseRadius : (index % 2 === 0 ? baseRadius : baseRadius + extraRadius);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        wrap.innerHTML = `<button type="button" class="topic-btn"><span>${item.text}</span></button>`;
        const btn = wrap.querySelector('button');
        btn.addEventListener('click', () => {
          document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          showArt(item);
        });
        orbitTopics.appendChild(wrap);
        requestAnimationFrame(() => {
          setTimeout(() => {
            wrap.classList.add('visible');
            wrap.style.transform = `translate(${x}px, ${y}px) scale(1)`;
          }, 60 * index);
        });
      });

      if (items[0]) {
        setTimeout(() => {
          const firstBtn = orbitTopics.querySelector('.topic-btn');
          if (firstBtn) firstBtn.click();
        }, 420);
      }
    }

    startButton.addEventListener('click', () => {
      showScreen('select');
      clearOrbit();
    });
    backToHomeBtn.addEventListener('click', () => showScreen('home'));
    resetOrbitBtn.addEventListener('click', clearOrbit);
    techMainBtn.addEventListener('click', () => activateMode('tech'));
    homeMainBtn.addEventListener('click', () => activateMode('home'));
    window.addEventListener('resize', () => { if (currentMode) activateMode(currentMode); });
  </script>
